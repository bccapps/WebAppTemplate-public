# =====================================================================
# Shared front nginx config (canonical superset).
#   - TK: Cloudflare real-IP restore + security headers / CSP + asset caching
#   - PW: WebSocket upgrade on the API proxy
# The backend port is injected at build time via envsubst '${NODE_PORT}'.
# The back service is always reachable as `back:${NODE_PORT}` on the compose
# network. All nginx runtime vars ($host, $uri, …) are preserved.
# =====================================================================

# ---------------------------------------------------------
# Cloudflare trusted proxies — restore real visitor IP
# (updated list: https://www.cloudflare.com/ips-v4/)
# ---------------------------------------------------------
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

server {
  listen 80;
  server_name _;

  # ---------------------------------------------------------
  # Security headers
  # ---------------------------------------------------------
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # CSP in report-only mode — monitor before switching to enforcing.
  # Reown/WalletConnect requires connect-src to *.walletconnect.org, *.reown.com, *.web3modal.com, *.web3modal.org and wss:.
  # Reown AppKit UI loads KHTeka fonts from fonts.reown.com.
  add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.reown.com; connect-src 'self' wss: https://*.walletconnect.org https://*.walletconnect.com https://*.reown.com https://*.web3modal.com https://*.web3modal.org; frame-ancestors 'none';" always;

  # ---------------------------------------------------------
  # Reverse proxy to backend API (WebSocket-ready)
  # ---------------------------------------------------------
  location /api/ {
    proxy_pass http://back:${NODE_PORT};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # ---------------------------------------------------------
  # Static front — SPA fallback
  # ---------------------------------------------------------
  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;

    # index.html (and any SPA-fallback response) references hashed chunk
    # filenames from THIS deploy only. Unlike those chunks it keeps the same
    # URL across deploys, so without an explicit no-cache directive a browser
    # (or an intermediary) can keep serving a pre-deploy copy that points at
    # chunk hashes no longer guaranteed to be mutually consistent — e.g. an
    # index.js built against one reactcommon/nestcommon submodule ref lazily
    # loading a chunk built against another, surfacing as "X.someMethod is
    # not a function" errors for users who don't hard-refresh after a deploy.
    add_header Cache-Control "no-cache" always;

    # PWA files keep a fixed URL across deploys: they must never be cached immutably, or an
    # installed app would stay on its old service worker. (No effect when the PWA is disabled.)
    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
      try_files $uri =404;
      add_header Cache-Control "no-cache" always;
    }

    # Cache hashed assets aggressively (Vite adds content hash)
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
      # Missing hashed asset (e.g. a stale tab referencing a chunk removed by a
      # newer deploy) must 404, not fall back to index.html — otherwise the
      # browser gets a text/html response for a JS/CSS module request.
      try_files $uri =404;
      expires 30d;
      add_header Cache-Control "public, immutable";
    }
  }
}
