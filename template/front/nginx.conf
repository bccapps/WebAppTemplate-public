# =====================================================================
# Shared front nginx config (canonical superset).
#   - TK: Cloudflare real-IP restore + security headers / CSP + asset caching
#   - PW: WebSocket upgrade on the API proxy
#   - AH: AgentHub git smart-HTTP remote (large streamed request bodies)
# The backend port is injected at build time via envsubst '${NODE_PORT}'.
# The back service is always reachable as `back:${NODE_PORT}` on the compose
# network. All nginx runtime vars ($host, $uri, …) are preserved.
# =====================================================================

# ---------------------------------------------------------
# Cloudflare trusted proxies — restore real visitor IP
# (updated list: https://www.cloudflare.com/ips-v4/)
# ---------------------------------------------------------
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

# ---------------------------------------------------------
# Report-only CSP, written ONCE here and read as $vx_csp_report_only by every block that sends the security headers
# (a `map` lives at http level: this file is included inside `http {}`).
# Reown/WalletConnect requires connect-src to *.walletconnect.org, *.reown.com, *.web3modal.com, *.web3modal.org and wss:.
# Reown AppKit UI loads KHTeka fonts from fonts.reown.com.
# ---------------------------------------------------------
map $host $vx_csp_report_only {
  default "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.reown.com; connect-src 'self' wss: https://*.walletconnect.org https://*.walletconnect.com https://*.reown.com https://*.web3modal.com https://*.web3modal.org; frame-ancestors 'none';";
}

server {
  listen 80;
  server_name _;

  # ---------------------------------------------------------
  # Security headers (SECURITY HEADERS block).
  # ⚠️ nginx inheritance: a location with ANY `add_header` of its own drops ALL of these (they are inherited only by a
  # level that sets none). Every location below that adds a header therefore repeats these four lines first, then its
  # own; an app's front/nginx.locations.conf must do the same (the CSP value: $vx_csp_report_only). Checked by
  # scripts/nginx-security-headers.test.mjs. (Not an `include` snippet: the prebuilt image ships nginx.conf alone.)
  # ---------------------------------------------------------
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # CSP in report-only mode — monitor before switching to enforcing.
  add_header Content-Security-Policy-Report-Only $vx_csp_report_only always;

  # ---------------------------------------------------------
  # Server-Sent Events (common/event-stream). Longest prefix wins over /api/: no buffering (events must reach the
  # browser immediately), a one-hour read timeout (the server sends a `: ping` comment every 20 s, which keeps
  # Cloudflare's 100 s idle limit away), and no `Connection: upgrade` (this is plain HTTP/1.1 streaming).
  # ---------------------------------------------------------
  # @app-locations — replaced by the app's optional front/nginx.locations.conf (scripts/merge-nginx-locations.mjs, run
  # by deploy-full.sh): app-specific locations (streaming gateways, large bodies) placed before the generic /api/.
  location /api/v1/events/ {
    proxy_pass http://back:${NODE_PORT};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 3600s;
  }

  # ---------------------------------------------------------
  # Reverse proxy to backend API (WebSocket-ready)
  # ---------------------------------------------------------
  location /api/ {
    proxy_pass http://back:${NODE_PORT};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # ---------------------------------------------------------
  # AH: AgentHub — git smart-HTTP remote hosted by the back (runners clone/fetch/push through it).
  # A push carries whole packfiles: no 1 MB default cap, the request body is streamed (never spooled to disk
  # first), and long transfers are not cut at 60 s. Declared before `/api/` is irrelevant (longest prefix wins);
  # it only exists to override those limits for this one path.
  # ---------------------------------------------------------
  location /api/v1/agenthub/git/ {
    proxy_pass http://back:${NODE_PORT};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 4g;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # ---------------------------------------------------------
  # Never serve logs (defence in depth): /images/graphs is the back's shared_directory volume (docker-compose.yml); logs
  # live in their own back_logs volume, but a LOG_DIR pointed at /app/shared/logs must not become public.
  # ---------------------------------------------------------
  location ^~ /images/graphs/logs/ {
    return 404;
  }

  # ---------------------------------------------------------
  # OAuth consent and error pages of the SPA (mcp-access front, any case: the front router is case-insensitive): never
  # framed (enforced CSP frame-ancestors + X-Frame-Options), never cached, own browsing context group; the report-only
  # CSP of every page is kept. An app without these routes gets its SPA 404 page, with the same headers. An app's own
  # blocks for these paths in front/nginx.locations.conf come first (spliced at @app-locations) and win.
  # ---------------------------------------------------------
  location ~* ^/oauth/consent/?$ {
    root /usr/share/nginx/html;
    try_files /index.html =404;
    # SECURITY HEADERS (repeated: see the server block)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy-Report-Only $vx_csp_report_only always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control "no-store" always;
    # The consent page sends the browser back to the client: its origin only.
    add_header Referrer-Policy "strict-origin" always;
  }
  location ~* ^/oauth/error/?$ {
    root /usr/share/nginx/html;
    try_files /index.html =404;
    # SECURITY HEADERS (repeated: see the server block)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy-Report-Only $vx_csp_report_only always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  # ---------------------------------------------------------
  # Static front — SPA fallback
  # ---------------------------------------------------------
  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;

    # index.html (and any SPA-fallback response) references hashed chunk
    # filenames from THIS deploy only. Unlike those chunks it keeps the same
    # URL across deploys, so without an explicit no-cache directive a browser
    # (or an intermediary) can keep serving a pre-deploy copy that points at
    # chunk hashes no longer guaranteed to be mutually consistent — e.g. an
    # index.js built against one reactcommon/nestcommon submodule ref lazily
    # loading a chunk built against another, surfacing as "X.someMethod is
    # not a function" errors for users who don't hard-refresh after a deploy.
    # SECURITY HEADERS (repeated: this block's own add_header would drop the server block's for the whole SPA)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy-Report-Only $vx_csp_report_only always;
    add_header Cache-Control "no-cache" always;

    # PWA files keep a fixed URL across deploys: they must never be cached immutably, or an
    # installed app would stay on its old service worker. (No effect when the PWA is disabled.)
    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
      try_files $uri =404;
      # SECURITY HEADERS (repeated: see the server block)
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy-Report-Only $vx_csp_report_only always;
      add_header Cache-Control "no-cache" always;
    }

    # Cache hashed assets aggressively (Vite adds content hash)
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
      # Missing hashed asset (e.g. a stale tab referencing a chunk removed by a
      # newer deploy) must 404, not fall back to index.html — otherwise the
      # browser gets a text/html response for a JS/CSS module request.
      try_files $uri =404;
      expires 30d;
      # SECURITY HEADERS (repeated: see the server block)
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy-Report-Only $vx_csp_report_only always;
      add_header Cache-Control "public, immutable";
    }
  }
}
