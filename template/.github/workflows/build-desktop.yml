# SKELETON, UNVERIFIED: never run on GitHub Actions. Copied into a project only when the desktop option is chosen
# (scripts/add-desktop.mjs, task G3). Builds the app natively on each OS: resources (Node, back, front,
# better-sqlite3) then the Tauri bundle. Signing is ad hoc on macOS; see desktop/README.md for Developer ID and
# notarization (not automated).
name: build-desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, runner: macos-14 }
          - { target: darwin-x64, runner: macos-13 }
          - { target: win-x64, runner: windows-2022 }
          - { target: linux-x64, runner: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux dependencies (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build the back
        working-directory: back
        run: npm ci && npm run build
      - name: Build the front
        working-directory: front
        run: npm ci && npm run build
      - name: Desktop tooling
        working-directory: desktop
        run: npm ci
      - name: Resources and bundle
        run: node scripts/desktop/build-desktop.mjs --target ${{ matrix.target }} --bundle
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: desktop/src-tauri/target/release/bundle/**/*
