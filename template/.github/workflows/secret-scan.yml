# vx-template: secret-scan workflow
# Copied into every project by scripts/update_common.sh (scripts/secret-scan.mjs) and refreshed on each run while this
# line is kept: edit the template (vx-public template/.github/workflows/secret-scan.yml), not the copy. Remove the line
# above to own the file (it is then never touched again). Template README, « Secret scanning ».
#
# Scans with the project's .gitleaks.toml (generated from the secret-format registry) and .gitleaksignore, values
# redacted: a push → the pushed commits (a new branch: its commits that no other branch of origin has), a pull request →
# its commits, a manual run → the whole history. The open-source gitleaks CLI, pinned and checksum-verified (the gitleaks
# GitHub Action needs a paid licence for organizations); no secret, read-only token, no submodule.
name: secret-scan

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          range=""
          if [ "$EVENT" = pull_request ]; then
            range="$BASE..$HEAD"
          elif [ "$EVENT" = push ]; then
            if [ -n "$BEFORE" ] && [ -n "${BEFORE//0/}" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              range="$BEFORE..$AFTER"
            else
              # A new branch: its commits that no OTHER branch of origin has (origin/HEAD may point to this very branch).
              range="$AFTER --not --exclude=origin/$BRANCH --exclude=origin/HEAD --remotes=origin"
            fi
          fi
          if [ -n "$range" ]; then
            "$RUNNER_TEMP/gitleaks" git . --log-opts="$range" --redact --verbose --no-banner --exit-code 1
          else
            "$RUNNER_TEMP/gitleaks" git . --redact --verbose --no-banner --exit-code 1
          fi
