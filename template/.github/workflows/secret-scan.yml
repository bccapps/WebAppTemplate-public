# vx-template: secret-scan workflow
# Copied into every project by scripts/update_common.sh (scripts/secret-scan.mjs) and refreshed on each run while this
# line is kept: edit the template (vx-public template/.github/workflows/secret-scan.yml), not the copy. Remove the line
# above to own the file (it is then never touched again). Template README, « Secret scanning ».
#
# Scans with the project's .gitleaks.toml (generated from the secret-format registry) and .gitleaksignore AS THEY WERE
# BEFORE the change (pull request: the base branch; push: the previous tip), values redacted, gitleaks:allow comments
# ignored, merge commits included (-m): a push → the pushed commits (a new branch: those no other branch of origin has; a
# force-push whose previous tip is gone: the commits GitHub lists for the push), a pull request → its commits, a manual
# run → the whole history. A pull request that changes .gitleaks.toml, .gitleaks.local.toml or .gitleaksignore fails:
# it needs a human review of that change. The open-source gitleaks CLI, pinned and checksum-verified (the gitleaks
# GitHub Action needs a paid licence for organizations); no secret, read-only token, no submodule.
name: secret-scan

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  # A newer push must not cancel the scan of an older one (its commits would never be scanned); a pull request rescans all.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PUSHED: ${{ join(github.event.commits.*.id, ' ') }}
          BASE_REF: ${{ github.base_ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          CONFIG_FILES=".gitleaks.toml .gitleaks.local.toml .gitleaksignore"
          scratch="$RUNNER_TEMP/secret-scan"
          mkdir -p "$scratch"
          # Configuration and ignore file of commit $1 (empty: the checkout). gitleaks also reads <source>/.gitleaksignore,
          # so its source is $scratch and the repository is reached through GIT_DIR / GIT_WORK_TREE.
          config_from() {
            if [ -n "$1" ]; then
              git show "$1:.gitleaks.toml" > "$scratch/config.toml" 2>/dev/null || printf '[extend]\nuseDefault = true\n' > "$scratch/config.toml"
              git show "$1:.gitleaksignore" > "$scratch/.gitleaksignore" 2>/dev/null || : > "$scratch/.gitleaksignore"
            else
              if [ -f .gitleaks.toml ]; then cp .gitleaks.toml "$scratch/config.toml"; else printf '[extend]\nuseDefault = true\n' > "$scratch/config.toml"; fi
              if [ -f .gitleaksignore ]; then cp .gitleaksignore "$scratch/.gitleaksignore"; else : > "$scratch/.gitleaksignore"; fi
            fi
          }
          scan() {
            rc=0
            GIT_DIR="$PWD/.git" GIT_WORK_TREE="$PWD" "$RUNNER_TEMP/gitleaks" git "$scratch" --log-opts="$1" --config "$scratch/config.toml" \
              --gitleaks-ignore-path "$scratch/.gitleaksignore" --ignore-gitleaks-allow --redact --verbose --no-banner --exit-code 3 || rc=$?
            if [ "$rc" -eq 3 ]; then echo "::error::a secret was found (above, redacted): remove it and revoke or rotate it"; exit 1; fi
            if [ "$rc" -ne 0 ]; then echo "::error::gitleaks failed (exit $rc, see above): the scan did not complete"; exit 1; fi
          }
          # The commit the other branches of origin share with AFTER (the configuration a new or force-pushed branch started from).
          base_of_others() {
            others=$(git for-each-ref --format='%(refname)' refs/remotes/origin/ | grep -v -x -e "refs/remotes/origin/$BRANCH" -e refs/remotes/origin/HEAD || true)
            if [ -n "$others" ]; then git merge-base "$AFTER" $others 2>/dev/null | head -n 1; fi
          }
          config_changed=""
          if [ "$EVENT" = pull_request ]; then
            config_from "origin/$BASE_REF"
            config_changed=$(git diff --name-only "$BASE...$HEAD" -- $CONFIG_FILES)
            scan "-m $BASE..$HEAD"
          elif [ "$EVENT" = push ]; then
            if [ -n "$BEFORE" ] && [ -n "${BEFORE//0/}" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              config_from "$BEFORE"
              config_changed=$(git diff --name-only "$BEFORE" "$AFTER" -- $CONFIG_FILES)
              scan "-m $BEFORE..$AFTER"
            elif [ -n "${BEFORE//0/}" ] && [ -n "$PUSHED" ]; then
              # A force-push whose previous tip is gone: the commits of this push only, not the whole history.
              base=$(base_of_others)
              config_from "$base"
              if [ -n "$base" ]; then config_changed=$(git diff --name-only "$base" "$AFTER" -- $CONFIG_FILES); fi
              scan "-m --no-walk $PUSHED"
            else
              # A new branch: its commits that no OTHER branch of origin has (origin/HEAD may point to this very branch).
              base=$(base_of_others)
              config_from "$base"
              if [ -n "$base" ]; then config_changed=$(git diff --name-only "$base" "$AFTER" -- $CONFIG_FILES); fi
              scan "-m $AFTER --not --exclude=origin/$BRANCH --exclude=origin/HEAD --remotes=origin"
            fi
          else
            config_from ""
            scan "--full-history --all -m"
          fi
          if [ -n "$config_changed" ]; then
            if [ "$EVENT" = pull_request ]; then
              echo "::error::this pull request changes the secret-scan configuration ($(echo $config_changed)): scanned with the base branch's; a human must review that change, then merge it on its own"
              exit 1
            fi
            echo "::warning::this push changes the secret-scan configuration ($(echo $config_changed)): scanned with the previous one"
          fi
