# Load environment variables for docker-compose variable substitution
# Variables in this file will be used for ${VARIABLE} substitution in this file
# For container environment variables, see env_file in each service
x-env-file: &env-file ../back/.env.dev

services:
  db:
    image: postgres:17-alpine
    restart: always
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c pg_stat_statements.max=10000
    env_file: *env-file
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: --auth-host=md5
    container_name: ${PROJECT_NAME}_postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '${INFRA_BIND:-127.0.0.1}:${DB_PORT}:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # API-role replicas: serve HTTP only (behind the LB). NODE_ROLE=api disables all background
  # work (schedulers, trading engines, run workers) so request serving is never blocked by
  # compute. Run launches/controls are forwarded to back-worker via Redis RPC.
  back:
    # Explicit tag shared with back-worker: the two services are byte-identical images that
    # differ only by NODE_ROLE (runtime env). Without it Compose derives one image name per
    # service, so BuildKit exports and unpacks the same content twice (~95 s and 1,2 Go per
    # deploy). PROJECT_NAME keeps the tag unique when several projects share a host.
    image: ${PROJECT_NAME}_back:latest
    build:
      context: ../back
      dockerfile: Dockerfile.selfhosted
      # Pre-creates /app/shared (chowned to node:node) in the image at the exact
      # path the shared_directory volume below mounts onto — Docker only inherits
      # that ownership into a volume the FIRST time it's created empty, so this
      # only matters for a brand-new volume/host (see the compose file's own
      # shared_directory: note for the one-time fix on an already-created volume).
      args:
        APP_RUNTIME_DIR: shared
    restart: unless-stopped
    user: "1000:1000"
    env_file:
      - ../back/.env
    environment:
      SHARED_DIRECTORY: /app/shared
      # BACK_WORKER=off (deploy-full.sh exports BACK_NODE_ROLE=all): single process, API + background work.
      NODE_ROLE: ${BACK_NODE_ROLE:-api}
      # Each replica identifies itself in Prometheus metrics via its container name.
      # Docker Compose appends -1, -2, ... automatically — no manual numbering needed.
      METRICS_TOKEN: ${METRICS_TOKEN}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '${NODE_PORT}'
    deploy:
      replicas: ${BACK_REPLICAS:-1}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${NODE_PORT}/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    volumes:
      - shared_directory:/app/shared

  # Worker-role instance: runs ALL background work (schedulers, trading engines, run workers),
  # owns runs and heartbeats to the WorkerRegistry. Deliberately NOT in the back-lb upstream so
  # its compute never blocks public API serving. Single instance (singleton crons are still
  # guarded by CronLockService for the brief old/new overlap during rolling deploys).
  back-worker:
    # Reuses the image built by the `back` service — no build: section on purpose.
    image: ${PROJECT_NAME}_back:latest
    restart: unless-stopped
    hostname: ${PROJECT_NAME}-worker
    user: "1000:1000"
    env_file:
      - ../back/.env
    # Only `back` manages the schema (DB_SCHEMA_MODE from back/.env, e.g. sync): two processes running the schema sync
    # at once on the same database lock each other (SQLite: "database is locked") or see a half-applied schema. The worker
    # therefore never synchronizes/migrates and starts after back is healthy (deploy-full.sh also starts it that way).
    # A per-connection <PREFIX>SCHEMA_MODE of another connection is NOT overridden here.
    environment:
      SHARED_DIRECTORY: /app/shared
      NODE_ROLE: worker
      DB_SCHEMA_MODE: manual
      METRICS_TOKEN: ${METRICS_TOKEN}
    depends_on:
      back:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '${NODE_PORT}'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${NODE_PORT}/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    volumes:
      - shared_directory:/app/shared

  back-lb:
    image: nginx:alpine
    restart: unless-stopped
    container_name: ${PROJECT_NAME}_back_lb
    depends_on:
      back:
        condition: service_healthy
    ports:
      - '${NODE_PORT}:${NODE_PORT}'
    environment:
      NODE_PORT: ${NODE_PORT}
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<NGINX
        upstream backend { server back:$${NODE_PORT} max_fails=3 fail_timeout=10s; }
        server {
            listen $${NODE_PORT};
            location / {
                # Maintenance mode: deploy-full.sh (deploy_back_host) touches this file
                # before stopping the old back/back-worker containers and removes it once
                # the new ones are healthy — back-lb itself is never stopped/recreated for
                # a back redeploy, so NODE_PORT never actually closes. No reload needed:
                # nginx re-checks whether the file exists on every single request.
                if (-f /etc/nginx/maintenance.flag) {
                    return 503;
                }
                proxy_pass http://backend;
                proxy_http_version 1.1;
                proxy_set_header Host \$$host;
                proxy_set_header X-Real-IP \$$remote_addr;
                proxy_set_header X-Forwarded-For \$$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto \$$scheme;
                proxy_set_header Upgrade \$$http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_read_timeout 300s;
                proxy_send_timeout 300s;
                client_max_body_size 50m;
                # Failover: retry on the other replica instead of surfacing a 502 (which the
                # browser reports as a misleading CORS error). Only idempotent methods retried.
                proxy_next_upstream error timeout http_502 http_503 http_504;
                proxy_next_upstream_tries 2;
                proxy_next_upstream_timeout 10s;
            }
            # Server-Sent Events (common/event-stream): unbuffered, one-hour read timeout, no connection upgrade.
            # The server sends a ": ping" comment every 20 s, below Cloudflare's 100 s idle limit.
            location /api/v1/events/ {
                if (-f /etc/nginx/maintenance.flag) {
                    return 503;
                }
                proxy_pass http://backend;
                proxy_http_version 1.1;
                proxy_set_header Host \$$host;
                proxy_set_header X-Real-IP \$$remote_addr;
                proxy_set_header X-Forwarded-For \$$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto \$$scheme;
                proxy_set_header Connection "";
                proxy_buffering off;
                proxy_cache off;
                gzip off;
                proxy_read_timeout 3600s;
                proxy_next_upstream error timeout http_502 http_503 http_504;
                proxy_next_upstream_tries 2;
            }
            # AH: AgentHub — git smart-HTTP remote hosted by the back (a runner next to the hub reaches it
            # here, over loopback). A push carries whole packfiles: no 50 MB cap, request body streamed
            # (never spooled), transfers not cut at 300 s. Same settings as front/nginx.conf.
            location /api/v1/agenthub/git/ {
                if (-f /etc/nginx/maintenance.flag) {
                    return 503;
                }
                proxy_pass http://backend;
                proxy_http_version 1.1;
                proxy_set_header Host \$$host;
                proxy_set_header X-Real-IP \$$remote_addr;
                proxy_set_header X-Forwarded-For \$$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto \$$scheme;
                client_max_body_size 4g;
                proxy_request_buffering off;
                proxy_buffering off;
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
            }
            error_page 503 @maintenance;
            location @maintenance {
                default_type application/json;
                add_header X-Maintenance "true" always;
                return 503 '{"maintenance":true}';
            }
        }
        NGINX
        nginx -g 'daemon off;'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: ${PROJECT_NAME}_redis
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    ports:
      - '${INFRA_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a ${REDIS_PASSWORD}} ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  front:
    build:
      context: ../front
      dockerfile: Dockerfile
      args:
        NODE_PORT: ${NODE_PORT}
        VITE_API_BASE_URL: /api
        VITE_REOWN_PROJECT_ID: ${VITE_REOWN_PROJECT_ID}
        VITE_AUTH_CHAIN_POLICY: ${VITE_AUTH_CHAIN_POLICY}
        VITE_AUTH_EXPECTED_CHAIN_ID: ${VITE_AUTH_EXPECTED_CHAIN_ID}
    restart: unless-stopped
    container_name: ${PROJECT_NAME}_front
    env_file:
      - ../front/.env
    depends_on:
      back:
        condition: service_healthy
    ports:
      - '${VITE_PORT}:80'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - shared_directory:/usr/share/nginx/html/images/graphs

  # Metrics agent: scrapes every back/back-worker container individually via Docker socket,
  # then pushes to the external Prometheus server via remote_write.
  # No inbound firewall rules needed — only outbound HTTPS to PROMETHEUS_REMOTE_WRITE_URL.
  # Not started by default — activate with:  docker compose --profile metrics up -d
  # See PROMETHEUS.md for full setup instructions.
  vmagent:
    image: victoriametrics/vmagent:latest
    restart: unless-stopped
    container_name: ${PROJECT_NAME}_vmagent
    profiles: [metrics]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - vmagent_data:/vmagentdata
    configs:
      - source: vmagent_config
        target: /etc/vmagent/config.yml
        mode: 0444
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN}
      PROJECT_NAME: ${PROJECT_NAME}
      NODE_PORT: ${NODE_PORT}
      # Destinations remote_write passées par VARIABLES et non en flags CLI :
      # `-remoteWrite.url` est répétable (vmagent réplique les séries vers
      # chaque destination), et avec `-envflag.enable` un flag répétable devient
      # une variable à valeurs séparées par des virgules. Une ligne `command:`
      # de compose ne peut pas boucler ; c'est donc le seul moyen de viser N
      # serveurs Prometheus sans réécrire le fichier à chaque ajout.
      #
      # Les identifiants s'apparient aux URL par POSITION : une seule valeur
      # pour deux URL n'authentifierait que la première. deploy-full.sh réplique
      # une valeur unique autant de fois qu'il y a d'URL.
      VM_remoteWrite_url: ${PROMETHEUS_REMOTE_WRITE_URLS}
      VM_remoteWrite_basicAuth_username: ${PROMETHEUS_BASIC_AUTH_USER}
      VM_remoteWrite_basicAuth_password: ${PROMETHEUS_BASIC_AUTH_PASSWORD}
    command:
      - -promscrape.config=/etc/vmagent/config.yml
      - -envflag.enable=true
      - -envflag.prefix=VM_
      - -loggerFormat=json
    depends_on:
      back:
        condition: service_healthy

volumes:
  redis_data:
  postgres_data:
    name: ${PROJECT_NAME}_postgres_data
  # GENERIC shared/persistent volume for this project's `back` + `back-worker` replicas
  # (mounted on both at /app/shared via SHARED_DIRECTORY, see the `back` service above).
  # Any feature that needs data to (a) survive a container restart/redeploy, or (b) be
  # visible to every replica on this host — not just the one that wrote it — should read
  # /write under $SHARED_DIRECTORY/<own-namespace> instead of inventing its own volume.
  # Existing consumers: nestcommon's ImageStorageService (`SHARED_DIRECTORY/<namespace>`,
  # e.g. cms/covers), the tradingbot backtest candle cache (`SHARED_DIRECTORY/backtest-candles`).
  # Caveat (see ImageStorageService's own doc comment): a Docker named volume is host-local,
  # so this only shares data across replicas on the SAME host — it is NOT available at all
  # under docker-compose-cloud.yml (multi-host target), which omits this volume entirely.
  # This pattern (and the volume name) is intentionally generic so other projects built from
  # this same apptemplate can reuse it as-is for their own persistent/shared-across-replicas needs.
  #
  # A volume already created before APP_RUNTIME_DIR=shared existed (see the back
  # service's build.args above) was mounted onto an empty image path and Docker
  # gave it root:root ownership — the node:node containers (user: "1000:1000")
  # then get EACCES on any write under it. One-time fix on a host with that stale
  # volume: `docker run --rm -v <project>_shared_directory:/shared alpine chown -R 1000:1000 /shared`.
  # A fresh volume on a rebuilt image no longer needs this.
  shared_directory:
  vmagent_data:

configs:
  vmagent_config:
    # VMAGENT_CONFIG_PATH is set to the absolute remote path by deploy-full.sh.
    # For local use (scripts/docker-compose.yml), it falls back to ./vmagent.yml.
    file: ${VMAGENT_CONFIG_PATH:-./vmagent.yml}

