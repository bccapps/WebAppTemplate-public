#
# HARDENED compose profile — for an app that must stay isolated from the machine it runs on (e.g. an app holding
# credentials of an upstream fleet, deployed next to that fleet's control node). Selected with
# COMPOSE_FILE_NAME=scripts/docker-compose-hardened.yml (back/.env); same deploy-full.sh flow as docker-compose.yml
# (staging, ../back → ./back rewrite, maintenance flag, back-lb reload, rollbacks). Template README, « Hardened
# compose profile », says when to use it, which variables it needs and its limits.
#
# Self-hosted Postgres only (DB_ENGINE=postgres|selfhosted): it defines `db`, so deploy-full.sh refuses it for any
# other engine (lib/db-engine.sh, assert_compose_matches_db_engine).
#
# Fail closed: every variable the isolation depends on is `${VAR:?…}` — unset or empty, `docker compose` refuses to
# render the file and nothing starts. They are written to back/.env by the deployment tooling (FleetForge, profile
# `webapp_hardening`), never by hand:
#   HARDEN_RUNTIME_UID / HARDEN_RUNTIME_GID  dedicated host account the code services run as (not root, not 1000/node)
#   HARDEN_SUBNET                            dedicated /24 of the project's only network (fixed, so the host firewall
#                                            can name it; outside Docker's default pools)
#   HARDEN_FRONT_IP / HARDEN_BACK_LB_IP      fixed addresses of the two relays (listed in the back's TRUST_PROXY)
#   HARDEN_BACK_LB_REALIP                    `set_real_ip_from <relay>;` directives for the trusted relays only
#   NODE_PORT, VITE_PORT, DB_PORT, REDIS_PORT, REDIS_PASSWORD (+ DB_USER, DB_NAME, DB_PASSWORD, PROJECT_NAME)
# Optional: HARDEN_BACK_MEM_LIMIT (1g) / HARDEN_BACK_CPUS (1.0) per code container, REDIS_MAXMEMORY(_POLICY).
#
# What each option is for, all services:
#   restart: unless-stopped   a container stopped on purpose (failed isolation check) must not come back by itself
#   no-new-privileges         no setuid/setgid escalation inside a container
#   one network `app`         fixed subnet, no `default` network, no `external` resource, nothing shared with
#                             another project; never `network_mode`, `pid`, `ipc`… of the host
#   named volumes only        no host path is ever mounted (no bind, no docker.sock, no `driver_opts` disguised
#                             bind), no `name:` (a fixed name could point at another project's volume)
#   ports                     literal address on every mapping: front and back-lb on `0.0.0.0:` (IPv4 only — a
#                             bare `PORT:PORT` also publishes `[::]`, outside the DOCKER-USER chain that filters
#                             them), db and redis on `127.0.0.1:`
#   mem_limit / cpus          a runaway or hostile container cannot starve the machine (the control node)
# Code services (back, back-worker: they hold the app's secrets and run its logic): dedicated uid:gid, read-only root
# filesystem (+ a /tmp tmpfs), every capability dropped, process count capped, no published port.
# Third-party services (db, redis, back-lb, front): their images start as root then drop to their own user, which
# needs CHOWN/SETUID/SETGID/… (and `cap_add` is refused by the checks), so only the capabilities none of them uses are
# dropped. No vmagent (mounts the Docker socket) and no voice-engine: a service outside back, back-worker, back-lb,
# front, db, redis is refused by the deployment checks.
#
# Not shared with docker-compose.yml on purpose: a volume has no fixed name here, so the Postgres volume is
# `<compose project>_postgres_data` (`<PROJECT_NAME>-back-<host>_postgres_data`): a renamed host or project starts on
# an EMPTY database (restore a dump), and switching an existing app from docker-compose.yml to this file does too.

# Code services: hardening shared by back and back-worker (same image, same account, same limits).
x-code-service: &code-service
  image: ${PROJECT_NAME:?PROJECT_NAME is required}_back:latest
  restart: unless-stopped
  user: "${HARDEN_RUNTIME_UID:?HARDEN_RUNTIME_UID is required}:${HARDEN_RUNTIME_GID:?HARDEN_RUNTIME_GID is required}"
  read_only: true
  # Node's os.tmpdir() and anything an app writes outside its volumes; /tmp is the only writable path of the root fs.
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - "no-new-privileges:true"
  mem_limit: ${HARDEN_BACK_MEM_LIMIT:-1g}
  cpus: ${HARDEN_BACK_CPUS:-1.0}
  pids_limit: 512
  env_file:
    - ../back/.env
  networks:
    - app
  expose:
    - '${NODE_PORT:?NODE_PORT is required}'
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${NODE_PORT}/api/v1/health || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 120s
  # Both owned by the dedicated account: the image creates the mount points owned by APP_RUNTIME_OWNER (build arg of
  # the back service below) and a NEW named volume inherits that ownership.
  volumes:
    - shared_directory:/app/shared
    - back_logs:/app/logs

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c pg_stat_statements.max=10000
    # No env_file: Postgres needs these three values, not the app's secrets (back/.env holds the upstream credentials).
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: --auth-host=md5
    container_name: ${PROJECT_NAME}_postgres
    security_opt:
      - "no-new-privileges:true"
    cap_drop: [AUDIT_WRITE, MKNOD, NET_BIND_SERVICE, NET_RAW, SETFCAP, SYS_CHROOT]
    mem_limit: 1g
    cpus: 1.0
    networks:
      - app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:?DB_PORT is required}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # API role (behind back-lb). Same split as docker-compose.yml: NODE_ROLE=api here, background work in back-worker;
  # BACK_WORKER=off makes deploy-full.sh export BACK_NODE_ROLE=all (single process).
  back:
    <<: *code-service
    build:
      context: ../back
      # The template's Dockerfile (deploy-full.sh swaps in Dockerfile.prebuilt after a local build): both honour the args.
      dockerfile: Dockerfile
      args:
        APP_RUNTIME_DIR: shared
        # /app/shared, /app/logs and /data are created owned by the dedicated account instead of node (1000).
        APP_RUNTIME_OWNER: "${HARDEN_RUNTIME_UID}:${HARDEN_RUNTIME_GID}"
    environment:
      SHARED_DIRECTORY: /app/shared
      NODE_ROLE: ${BACK_NODE_ROLE:-api}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # The dedicated account has no entry in the image's /etc/passwd (HOME would be `/`, read-only): tools that write
      # under HOME (git, npm caches) get the tmpfs.
      HOME: /tmp
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: ${BACK_REPLICAS:-1}

  # Worker role: every background job. Only `back` manages the schema (see docker-compose.yml).
  back-worker:
    <<: *code-service
    hostname: ${PROJECT_NAME}-worker
    environment:
      SHARED_DIRECTORY: /app/shared
      NODE_ROLE: worker
      DB_SCHEMA_MODE: manual
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      HOME: /tmp
    depends_on:
      back:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # nginx in front of the back replicas, published on NODE_PORT. Its configuration is written by a QUOTED heredoc
  # (<<'NGINX'): the shell leaves it alone, Compose interpolates ${…} and turns $$ into $, so nginx gets `$host`.
  #   - Client address: only the trusted relays (HARDEN_BACK_LB_REALIP, validated before nginx starts) may set it
  #     through X-Forwarded-For; every proxied location then REWRITES X-Forwarded-For to that single address (never
  #     appends to the received header), so a client cannot smuggle a forged hop to the back.
  #   - Maintenance: deploy-full.sh touches /etc/nginx/maintenance.flag around a back switch (503 JSON), then reloads
  #     nginx; hence a writable root filesystem for this service.
  back-lb:
    image: nginx:1.30-alpine
    restart: unless-stopped
    container_name: ${PROJECT_NAME}_back_lb
    security_opt:
      - "no-new-privileges:true"
    cap_drop: [AUDIT_WRITE, MKNOD, NET_BIND_SERVICE, NET_RAW, SETFCAP, SYS_CHROOT]
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      back:
        condition: service_healthy
    ports:
      - "0.0.0.0:${NODE_PORT}:${NODE_PORT}"
    networks:
      app:
        ipv4_address: ${HARDEN_BACK_LB_IP:?HARDEN_BACK_LB_IP is required}
    environment:
      HARDEN_BACK_LB_REALIP: ${HARDEN_BACK_LB_REALIP:?HARDEN_BACK_LB_REALIP is required}
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ "$$(printf '%s' "$$HARDEN_BACK_LB_REALIP" | head -n 1)" != "$$HARDEN_BACK_LB_REALIP" ] \
          || ! printf '%s\n' "$$HARDEN_BACK_LB_REALIP" | grep -Eqx '(set_real_ip_from [0-9]{1,3}(\.[0-9]{1,3}){3}(/32)?; ?)+'; then
          echo 'back-lb: HARDEN_BACK_LB_REALIP must be one line of `set_real_ip_from <IPv4 address>;` directives, refusing to start' >&2
          exit 1
        fi
        cat > /etc/nginx/conf.d/default.conf <<'NGINX'
        ${HARDEN_BACK_LB_REALIP}
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;
        server_tokens off;
        server {
            listen ${NODE_PORT};
            client_max_body_size 128k;
            location / {
                if (-f /etc/nginx/maintenance.flag) {
                    return 503;
                }
                proxy_pass http://back:${NODE_PORT};
                proxy_http_version 1.1;
                proxy_set_header Host $$host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$remote_addr;
                proxy_set_header Connection "";
                proxy_buffering off;
                proxy_read_timeout 180s;
            }
            error_page 503 @maintenance;
            location @maintenance {
                default_type application/json;
                add_header X-Maintenance "true" always;
                return 503 '{"maintenance":true}';
            }
        }
        NGINX
        exec nginx -g 'daemon off;'

  # Password ALWAYS required, never on a command line (`ps` shows arguments to every account of the machine): it comes
  # from the environment and goes into a 0600 config file on the data volume; the healthcheck authenticates through
  # REDISCLI_AUTH. docker-entrypoint.sh still chowns /data and drops to the redis user.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: ${PROJECT_NAME}_redis
    security_opt:
      - "no-new-privileges:true"
    cap_drop: [AUDIT_WRITE, MKNOD, NET_BIND_SERVICE, NET_RAW, SETFCAP, SYS_CHROOT]
    mem_limit: 512m
    cpus: 0.5
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required: Redis is always authenticated in the hardened profile}"
    # The charset guard keeps the value a single token of redis.conf (a space or a quote would change the directive).
    entrypoint:
      - /bin/sh
      - -c
      - |
        case "$$REDIS_PASSWORD" in
          *[!A-Za-z0-9._~+/=-]*) echo 'redis: REDIS_PASSWORD must match [A-Za-z0-9._~+/=-]+, refusing to start' >&2; exit 1 ;;
        esac
        umask 077
        printf 'requirepass %s\nappendonly yes\nappendfsync everysec\nmaxmemory ${REDIS_MAXMEMORY:-256mb}\nmaxmemory-policy ${REDIS_MAXMEMORY_POLICY:-volatile-ttl}\n' "$$REDIS_PASSWORD" > /data/redis.conf
        exec docker-entrypoint.sh redis-server /data/redis.conf
    networks:
      - app
    ports:
      - "127.0.0.1:${REDIS_PORT:?REDIS_PORT is required}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Static SPA served by nginx; relays /api/ to back (front/nginx.conf). No env_file: it needs none at run time.
  front:
    build:
      context: ../front
      dockerfile: Dockerfile
      args:
        NODE_PORT: ${NODE_PORT}
        VITE_API_BASE_URL: /api
        VITE_REOWN_PROJECT_ID: ${VITE_REOWN_PROJECT_ID:-}
        VITE_AUTH_CHAIN_POLICY: ${VITE_AUTH_CHAIN_POLICY:-}
        VITE_AUTH_EXPECTED_CHAIN_ID: ${VITE_AUTH_EXPECTED_CHAIN_ID:-}
    restart: unless-stopped
    container_name: ${PROJECT_NAME}_front
    security_opt:
      - "no-new-privileges:true"
    # Keeps NET_BIND_SERVICE: nginx listens on 80 inside the container.
    cap_drop: [AUDIT_WRITE, MKNOD, NET_RAW, SETFCAP, SYS_CHROOT]
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      back:
        condition: service_healthy
    ports:
      - "0.0.0.0:${VITE_PORT:?VITE_PORT is required}:80"
    networks:
      app:
        ipv4_address: ${HARDEN_FRONT_IP:?HARDEN_FRONT_IP is required}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - shared_directory:/usr/share/nginx/html/images/graphs

networks:
  # The project's only network: a fixed /24 (front and back-lb at fixed addresses, the host firewall admits this
  # subnet to back-lb), bridge driver, IPv4 only.
  app:
    ipam:
      config:
        - subnet: ${HARDEN_SUBNET:?HARDEN_SUBNET is required}

volumes:
  postgres_data:
  redis_data:
  # Shared by back and back-worker (SHARED_DIRECTORY) and served read-only by the front under /images/graphs.
  shared_directory:
  # Logs of back and back-worker only: never under shared_directory, which the front serves.
  back_logs:
