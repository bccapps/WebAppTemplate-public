services:
  back:
    build:
      context: ../back
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: ${PROJECT_NAME}_preprod_back
    env_file:
      - ../back/.env.preprod
    # SQLite only (DB_ENGINE=sqlite): the database file lives on the sqlite_data volume, whatever DB_PATH says in
    # back/.env (a relative path would sit in the container's writable layer and vanish at each deploy). Unused otherwise.
    environment:
      DB_PATH: /data/${PROJECT_NAME}_preprod.db
    volumes:
      - sqlite_data:/data
    ports:
      - '${NODE_PORT}:${NODE_PORT}'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${NODE_PORT}/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Voice engine (speech-to-text, text-to-speech, VAD, end-of-turn, speaker embedding): a container of its own, so that a native
  # crash or a memory overrun can never take the API down. Internal network only (`expose`, never published); the back reaches
  # it at ws://voice-engine:7840/v1 (VOICE_ENGINE_URL). Off by default: the service belongs to the `voice` profile, which
  # deploy-full.sh enables when VOICE_ENGINE=on in back/.env. No model in the image: they are downloaded into the voice_models
  # volume at first use. The image is built from a private GitHub release of vx-voice-engine (BuildKit secret gh_token, read
  # from VOICE_ENGINE_RELEASE_TOKEN, which deploy-full.sh sets for the build command only from git's credential helpers —
  # never from back/.env, which reaches the containers).
  voice-engine:
    profiles: [voice]
    image: ${PROJECT_NAME}_voice_engine:${VOICE_ENGINE_VERSION:-dev}
    build:
      context: ./voice-engine
      dockerfile: Dockerfile
      args:
        VOICE_ENGINE_VERSION: ${VOICE_ENGINE_VERSION:-dev}
        VOICE_ENGINE_REPO: ${VOICE_ENGINE_REPO:-svax974/vx-voice-engine}
      secrets:
        - gh_token
    restart: unless-stopped
    container_name: ${PROJECT_NAME}_voice_engine
    environment:
      VOICE_ENGINE_MODE: hub
      VOICE_ENGINE_TOKEN: ${VOICE_ENGINE_TOKEN:-}
      VOICE_ENGINE_MEMORY_MB: ${VOICE_ENGINE_MEMORY_MB:-3000}
      VOICE_ENGINE_THREADS: ${VOICE_ENGINE_THREADS:-4}
    expose:
      - '7840'
    mem_limit: ${VOICE_ENGINE_MEM_LIMIT:-4g}
    cpus: ${VOICE_ENGINE_CPUS:-4}
    volumes:
      - voice_models:/models
      - voice_cache:/cache
    healthcheck:
      test: ["CMD", "/opt/vx-voice-engine/vx-voice-engine", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  front:
    build:
      context: ../front
      dockerfile: Dockerfile
      args:
        NODE_PORT: ${NODE_PORT}
        VITE_API_BASE_URL: /api
        VITE_REOWN_PROJECT_ID: ${VITE_REOWN_PROJECT_ID}
        VITE_AUTH_CHAIN_POLICY: ${VITE_AUTH_CHAIN_POLICY}
        VITE_AUTH_EXPECTED_CHAIN_ID: ${VITE_AUTH_EXPECTED_CHAIN_ID}
    restart: unless-stopped
    container_name: ${PROJECT_NAME}_preprod_front
    depends_on:
      back:
        condition: service_healthy
    ports:
      - '${VITE_PORT}:80'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sqlite_data:
  # Voice engine (profile `voice`): downloaded models (several GB, kept across redeploys) and derived voice profiles (rebuildable).
  voice_models:
    name: ${PROJECT_NAME}_voice_models
  voice_cache:
    name: ${PROJECT_NAME}_voice_cache

# Voice engine image build only (profile `voice`): token with read access to the releases of the private vx-voice-engine repository.
secrets:
  gh_token:
    environment: VOICE_ENGINE_RELEASE_TOKEN
