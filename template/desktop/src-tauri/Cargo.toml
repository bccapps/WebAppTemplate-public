[package]
name = "desktop-shell"
version = "0.1.0"
description = "Generic desktop shell: starts the project's back (and optional sidecars), then shows the front"
edition = "2021"
license = "MIT"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

# The shell is small: the app's weight is the embedded Node runtime and the back.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
