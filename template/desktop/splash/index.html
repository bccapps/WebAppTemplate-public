<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>Starting…</title>
  <style>
    /* Colors come from desktop.config.json (splash.brand), applied by init(). */
    :root { --bg: #0d0b0a; --ink: #efe8e1; --accent: #ff5b37; --danger: #ff6b6b; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); }
    body {
      display: grid; place-items: center; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased; user-select: none; cursor: default;
    }
    main { width: min(560px, calc(100vw - 48px)); text-align: center; }
    .mark { width: 64px; height: 64px; margin: 0 auto 22px; animation: breathe 2.6s ease-in-out infinite; }
    .mark circle { stroke: var(--accent); }
    .mark .dot { fill: var(--accent); }
    h1 { margin: 0; font-weight: 600; font-size: clamp(30px, 6vw, 44px); line-height: 1.1; letter-spacing: -0.01em; }
    .status {
      margin-top: 18px; min-height: 1.4em; opacity: .65;
      font: 12px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 0.08em; text-transform: uppercase;
    }
    .bar { width: 140px; height: 2px; margin: 18px auto 0; background: color-mix(in srgb, var(--ink) 18%, transparent); overflow: hidden; border-radius: 2px; }
    .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: var(--accent);
      box-shadow: 0 0 12px var(--accent); animation: slide 1.5s ease-in-out infinite;
    }
    .error { display: none; margin-top: 26px; text-align: left; }
    body.failed .error { display: block; animation: rise .4s ease both; }
    body.failed .bar, body.failed .mark { display: none; }
    .error h2 { margin: 0 0 8px; font-size: 15px; font-weight: 600; color: var(--danger); }
    .error p { margin: 0 0 12px; opacity: .7; font-size: 13.5px; line-height: 1.55; user-select: text; }
    .error pre {
      margin: 0; padding: 12px 14px; max-height: 38vh; overflow: auto; white-space: pre-wrap; word-break: break-word;
      background: color-mix(in srgb, var(--ink) 7%, transparent); border: 1px solid color-mix(in srgb, var(--ink) 18%, transparent);
      border-radius: 12px; font: 11.5px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; user-select: text;
    }
    @keyframes breathe { 0%, 100% { opacity: .55; transform: scale(.97); } 50% { opacity: 1; transform: scale(1); } }
    @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="10.5" fill="none" stroke-width="3" />
      <circle class="dot" cx="16" cy="16" r="3.5" />
    </svg>
    <h1 id="title"></h1>
    <div class="status" id="status"></div>
    <div class="bar" aria-hidden="true"></div>
    <section class="error" id="error" role="alert">
      <h2 id="error-title"></h2>
      <p id="error-detail"></p>
      <pre id="error-log"></pre>
    </section>
  </main>
  <script>
    // Driven by the Rust shell through webview.eval(): init() once, then status() / error().
    // Messages arrive as ids + parameters and are translated here (language: navigator.language, fallback en).
    (function () {
      var texts = {};
      var $ = function (id) { return document.getElementById(id); };

      function t(id, params) {
        var lang = (navigator.language || "en").slice(0, 2);
        var table = texts[lang] && texts[lang][id] !== undefined ? texts[lang] : texts.en || {};
        var text = table[id] !== undefined ? table[id] : id;
        return text.replace(/\{(\w+)\}/g, function (m, key) { return params && key in params ? params[key] : m; });
      }

      window.desktopSplash = {
        init: function (cfg) {
          texts = cfg.texts || {};
          var root = document.documentElement.style;
          root.setProperty("--bg", cfg.brand.background);
          root.setProperty("--ink", cfg.brand.foreground);
          root.setProperty("--accent", cfg.brand.accent);
          document.title = cfg.productName;
          $("title").textContent = cfg.productName;
        },
        status: function (id, params) {
          document.body.classList.remove("failed");
          $("status").textContent = t(id, params);
        },
        error: function (titleId, detailId, params, log) {
          document.body.classList.add("failed");
          $("status").textContent = "";
          $("error-title").textContent = t(titleId, params);
          $("error-detail").textContent = t(detailId, params);
          var pre = $("error-log");
          pre.textContent = log || "";
          pre.style.display = log ? "block" : "none";
        },
      };
    })();
  </script>
</body>
</html>
