name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tooling tests
        run: node --test template/scripts/*.test.mjs template/tools/*.test.mjs
      - name: Module boundaries
        run: node tools/check-boundaries.mjs --root . --stack-dirs nest,react --allowed tools/allowed.json
      - name: Module manifests (module.json vs real imports)
        run: node tools/check-boundaries.mjs --root . --stack-dirs nest,react --check-manifests --visibility public
      - name: License headers
        run: node tools/license-headers.mjs --root . --license mit --check
      # The gitleaks GitHub Action needs a paid license for organizations; the open-source CLI does not.
      - name: Secret scan
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --redact --exit-code 1

  sandbox:
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        mode: [anonymous, anonymous-sqlite, users-only, multi-users]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Git flow (create-project, update_common, deploy staging) against local origins
        if: matrix.mode == 'anonymous'
        run: tools/ci-git-flow.sh
      - name: Create a ${{ matrix.mode }} project with the wizard, build back + front, run back tests
        run: tools/ci-sandbox.sh ${{ matrix.mode }}
